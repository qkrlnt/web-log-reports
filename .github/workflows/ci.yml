name: CI

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  RADONFILESENCODING: UTF-8

jobs:
  commit-policy:
    name: commit-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check Conventional Commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="$BASE_SHA..$HEAD_SHA"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            RANGE="$BEFORE_SHA..$HEAD_SHA"
          else
            RANGE="$HEAD_SHA"
          fi
          python scripts/check_commits.py --range "$RANGE"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts

  tests-and-metrics:
    name: tests-and-metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - name: Unit and integration tests with coverage
        run: |
          mkdir -p reports
          python -m pytest --cov=web_log_reports --cov-branch --cov-report=term-missing --cov-report=xml:reports/coverage.xml --cov-report=html:reports/htmlcov --cov-fail-under=80 --junitxml=reports/junit.xml
      - name: Collect quality metrics
        if: ${{ always() }}
        run: python scripts/collect_metrics.py
      - name: Show metrics in run summary
        if: ${{ always() }}
        run: |
          if [ -f reports/metrics.json ]; then
            echo '## Quality metrics' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat reports/metrics.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload test and metric reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          retention-days: 30
          if-no-files-found: error

  build:
    name: build
    needs: [commit-policy, lint, tests-and-metrics]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m build --no-isolation
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
