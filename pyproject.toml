[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "web-log-reports"
version = "0.1.0"
description = "Web server log analysis and report generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi==0.115.6", "uvicorn==0.34.0"]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1", "pytest==8.3.4", "pytest-cov==6.0.0",
  "ruff==0.9.2", "radon==6.0.1", "build==1.2.2.post1",
  "setuptools==75.8.0", "wheel==0.45.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = ["--basetemp=.pytest-tmp"]

[tool.coverage.run]
branch = true
source = ["web_log_reports"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
